[project]
name = "llamacpp-kaller"
version = "0.1.0"
description = "kaller, the Arkitekt room assistant that runs actions, driven by a local llama.cpp model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arkitekt[all]>=14.0",
    "alpaka[openai]>=3.5",
    "rekuest>=13.1",
    "kabinet>=8",
    "mikro>=12.2",
    "graphql-core>=3.2",
    "httpx>=0.27",
    # setups.yaml
    "pyyaml>=6",
    # The assistant itself: its tools, the approval flow, memory and the turn loop. Pinned to a
    # commit, since the repository has no releases; move the pin to take its changes.
    "kaller @ git+https://github.com/jhnnsrs/kaller@f6107f7",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not hub'"

[tool.semantic_release]
version_variables = ["app.py:__version__"]
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
allow_zero_version = true

[tool.semantic_release.branches.release]
match = "main"
prerelease = false
